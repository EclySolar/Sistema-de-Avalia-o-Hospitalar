<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Pesquisa de satisfação | FHDOD</title>
    <link rel="stylesheet" href="/assets/style.css" />
  </head>
  <body>
    <main>
      <h1 id="title">Pesquisa de satisfação</h1>
      <p>Seu relato é anônimo e ajuda a melhorar nosso atendimento.</p>
      <form id="survey">
        <label
          >Data do atendimento<input
            type="date"
            name="attendanceDate"
            required /></label
        ><label
          >Turno<select name="shift">
            <option value="morning">Manhã</option>
            <option value="afternoon">Tarde</option>
            <option value="night">Noite</option>
          </select></label
        >
        <div id="questions"></div>
        <button>Enviar avaliação</button>
      </form>
      <p id="message"></p>
    </main>
    <script src="/assets/survey.js"></script>
  </body>
</html>
